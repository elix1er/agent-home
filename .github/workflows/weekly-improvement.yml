name: Weekly review

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open one weekly review reminder
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Weekly agent-home review';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              core.notice(`Existing review: #${existing.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body: [
                'Run `automations/weekly-review.md` with your preferred agent.',
                '',
                '- [ ] Choose at most one useful improvement',
                '- [ ] Use an `agent/*` branch and pull request for changes',
                '- [ ] Close this issue when reviewed',
                '',
                'If nothing is worth changing, close with `no change`.',
              ].join('\n'),
            });

            core.notice(`Created review: #${issue.number}`);
