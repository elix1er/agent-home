name: Weekly review

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open one weekly review reminder
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Weekly agent-home review';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'agent:inbox' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'agent:inbox',
                color: 'D4C5F9',
                description: 'Actionable agent task',
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              core.notice(`Existing review: #${existing.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body: [
                '## Desired outcome',
                'Run `automations/weekly-review.md` with the preferred agent.',
                '',
                '## Constraints',
                'Choose at most one genuinely useful improvement. Never auto-merge or deploy.',
                '',
                '## Acceptance criteria',
                '- [ ] One useful improvement is proposed or completed, or the issue is closed with `no change`',
                '- [ ] Repository changes use an `agent/*` branch and pull request',
                '',
                '## Priority',
                'low',
                '',
                '## Enabled capability grants',
                '- `github.issues.write`',
              ].join('\n'),
              labels: ['agent:inbox'],
            });

            core.notice(`Created review: #${issue.number}`);
